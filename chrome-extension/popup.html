<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>YouTube Sentiment</title>
  <style>
    body {
      width: 380px;
      padding: 18px;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #172033;
    }

    h1 { font-size: 21px; }

    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 8px;
      background: #2458d3;
      color: white;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }

    #status, #summary {
      line-height: 1.5;
      white-space: pre-line;
    }

    #results {
      max-height: 350px;
      overflow-y: auto;
    }

    .comment {
      background: white;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border-left: 5px solid #64748b;
      overflow-wrap: anywhere;
    }

    .positif { border-color: #16a34a; }
    .negatif { border-color: #dc2626; }
    .neutre { border-color: #64748b; }

    .comment p { margin-bottom: 0; }
select {
  width: 100%;
  padding: 10px;
  margin: 8px 0 12px;
  border-radius: 8px;
}

body.dark {
  background: #111827;
  color: #f3f4f6;
}

body.dark .comment {
  background: #1f2937;
}

body.dark select {
  background: #1f2937;
  color: #f3f4f6;
}
.chart-row {
  margin-bottom: 12px;
}

.chart-row label {
  display: block;
  margin-bottom: 4px;
}

.chart-row progress {
  width: 100%;
  height: 18px;
}
  </style>
</head>
<body>
  <h1>YouTube Sentiment</h1>
  <p>Analyse jusqu’à 50 commentaires chargés dans la page.</p>

  <button id="check-api">Tester la connexion</button>
  <button id="analyze">Analyser les commentaires</button>
<button id="toggle-theme">Changer le thème</button>

<label for="sentiment-filter">Afficher :</label>
<select id="sentiment-filter">
  <option value="all">Tous les sentiments</option>
  <option value="positif">Positifs</option>
  <option value="neutre">Neutres</option>
  <option value="negatif">Négatifs</option>
</select>

<button id="copy-results">Copier les commentaires affichés</button>

  <p id="status" role="status" aria-live="polite">Prêt.</p>
  <p id="summary"></p>
<div id="chart"></div>
<button id="export-results">Exporter l’analyse en JSON</button>
  <div id="results"></div>

  <script src="popup.js"></script>
</body>
</html>
